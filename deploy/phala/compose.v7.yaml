# Fusionner avec compose.yaml après préparation du volume et validation de l'image.
services:
  runner:
    image: ${SIRIUS_RUNNER_IMAGE:?Image v7 immuable requise}
    environment:
      RUNNER_BOOTSTRAP_ONLY: "false"
      SIRIUS_BILLING_VERSION: "7"
      RUNNER_MONITOR_SECRET: ${RUNNER_MONITOR_SECRET:?Secret de supervision requis}
      RUNNER_BUDGET_FILE: /var/lib/sirius-runner/budget/ledger.sqlite
      RUNNER_BILLING_POLICY_FILE: /var/lib/sirius-runner/budget/billing-policy.json
      SIRIUS_EVM_FINALITY: finalized
      SIRIUS_EVM_CONFIRMATIONS: ${SIRIUS_EVM_CONFIRMATIONS:?Profondeur validée requise}
      # Finalité rapide (src/lib/evm/fast-finality.ts) : constantes couvertes par le hash du Compose,
      # donc par l'attestation. L'enclave n'accorde le palier rapide qu'aux prêts ≤ 25 MUSD, après
      # 30 confirmations L2 et contrôle canonique, et tant que ses prêts rapides verrouillés non
      # libérés (registre runner_budget) restent ≤ 100 MUSD ; Next tient son propre plafond. Les
      # changer change le compose hash : docs/passage-mainnet/20-finalite-rapide.md.
      SIRIUS_FAST_FINALITY: "true"
      SIRIUS_FAST_FINALITY_MAX_USDC: "25"
      SIRIUS_FAST_FINALITY_TOTAL_USDC: "100"
      SIRIUS_FAST_FINALITY_CONFIRMATIONS: "30"
    volumes:
      - runner_budget:/var/lib/sirius-runner/budget

volumes:
  runner_budget:
